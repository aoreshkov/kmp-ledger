// Compose compiler stability configuration.
//
// core:model applies only `ledger.kotlin.multiplatform` — no Compose compiler plugin — so the domain
// types stay free of any Compose dependency (the layering rule in CLAUDE.md). The cost is that its
// classes ship without stability metadata, so every consumer infers them unstable and strong skipping
// falls back to comparing them by instance identity. The Room-backed flow re-allocates each model on
// any write, so that identity never holds and the composables taking them never skip.
//
// Every type under this package is an immutable holder (`val`-only, String/enum fields), so declaring
// it stable states what the module's shape already guarantees. Keep it that way: a `var` or a mutable
// collection field anywhere under core.model silently invalidates this file.
app.oreshkov.ledger.core.model.**

// `PostingListUiState.Success` holds a `List<Posting>`, and kotlin.collections.List is unstable to
// the compiler because the interface admits mutable implementations — so the state stayed unstable
// even with Posting declared above. The `<*>` generic mask is the narrow form: it does not assert
// that every List is stable, it says a List is exactly as stable as its element type. `List<Posting>`
// therefore becomes stable, while a list of something unstable stays unstable.
//
// The claim this does make is that lists reaching composables are never mutated in place. That holds
// here: the only such lists are the freshly mapped list from the Room-backed flow, a compile-time
// `listOf` of theme labels, and the snapshot-backed NavBackStack, which notifies on its own.
kotlin.collections.List<*>
