kotlin.code.style=official

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Kotlin Experimental
kotlin.experimental.swift-export.enabled=true
kotlin.swift-export.experimentalFeature.nowarn=true
kotlin.swift-export.experimental.nowarn=true
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlinx.coroutines.debug=off
kotlin.compiler.jvmargs=-Dkotlinx.coroutines.debug=off