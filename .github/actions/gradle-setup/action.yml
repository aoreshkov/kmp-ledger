name: gradle-setup
description: "Setup Java and Gradle with caching"
inputs:
  cache-disabled:
    description: "Disable Gradle home caching for this job (e.g. the Windows desktop leg, where saves fail with a Path Validation Error)."
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Setup Java
      uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
      with:
        java-version: "21"
        distribution: "temurin"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      with:
        cache-disabled: ${{ inputs.cache-disabled }}
