name: gradle-setup
description: "Setup Java and Gradle with caching"
inputs:
  cache-disabled:
    description: "Disable Gradle home caching for this job. No caller sets it today; kept as an escape hatch for a job whose cache is not worth storing."
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Setup Java
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
      with:
        java-version: "21"
        distribution: "temurin"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      with:
        cache-disabled: ${{ inputs.cache-disabled }}
