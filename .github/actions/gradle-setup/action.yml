name: gradle-setup
description: "Setup Java and Gradle with caching"
runs:
  using: "composite"
  steps:
    - name: Setup Java
      uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
      with:
        java-version: "21"
        distribution: "temurin"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      # The Windows "Path Validation Error" on cache save is fixed by pinning
      # GRADLE_USER_HOME in the workflow env (build and cache action now share
      # one same-drive path), not by cache-overwrite-existing.
