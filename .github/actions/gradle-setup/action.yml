name: gradle-setup
description: "Setup Java and Gradle with caching"
inputs:
  cache-disabled:
    description: "Disable Gradle home caching for this job. No caller sets it today; kept as an escape hatch for a job whose cache is not worth storing."
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Setup Java
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
      with:
        java-version: "21"
        distribution: "temurin"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      with:
        cache-disabled: ${{ inputs.cache-disabled }}
