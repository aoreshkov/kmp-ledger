name: gradle-setup
description: "Setup Java and Gradle with caching"
runs:
  using: "composite"
  steps:
    - name: Setup Java
      uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
      with:
        java-version: "21"
        distribution: "temurin"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      with:
        # Allow the new-version cache to be written even when a stale-version
        # entry was restored (e.g. right after a Gradle wrapper bump). Without
        # this, Windows save fails with "Path Validation Error" and never seeds
        # the new cache, so the failure recurs every run.
        cache-overwrite-existing: true
