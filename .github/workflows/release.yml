name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify tag matches version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag against gradle.properties
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROP_VERSION="$(grep '^ledger.version.name=' gradle.properties | cut -d= -f2)"
          echo "Tag: $TAG_VERSION | gradle.properties: $PROP_VERSION"
          if [ "$TAG_VERSION" != "$PROP_VERSION" ]; then
            echo "::error::Tag 'v$TAG_VERSION' does not match ledger.version.name='$PROP_VERSION' in gradle.properties."
            exit 1
          fi

  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    needs: verify-version
    # Signing secrets live in the "release" environment, restricted to v* tags.
    environment: release
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Decode release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — release APK will be unsigned."
          fi

      - name: Build Android Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease

      - name: Upload Android Release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-release-apk
          path: androidApp/build/outputs/apk/release/*.apk

  build-desktop:
    name: Build Desktop Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify-version
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup
        with:
          # Windows cache save fails with a Path Validation Error; disable to avoid noise.
          cache-disabled: ${{ matrix.os == 'windows-latest' }}

      - name: Package Desktop App
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS --no-configuration-cache

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-release-binaries-${{ matrix.os }}
          path: |
            desktopApp/build/compose/binaries/main/app/*
            desktopApp/build/compose/binaries/main/msi/*
            desktopApp/build/compose/binaries/main/dmg/*
            desktopApp/build/compose/binaries/main/deb/*
            desktopApp/build/compose/binaries/main/rpm/*

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write       # mint OIDC token for provenance attestation
      attestations: write   # write the build provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.apk' -o -name '*.msi' -o -name '*.dmg' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.zip' -o -name '*.tar.gz' \) -print0 \
            | xargs -0 sha256sum > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: SHA256SUMS

      - name: Extract Changelog
        id: extract_changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract section between the version header and the next header
          sed -n "/^## \[$VERSION\]/,/^## /p" CHANGELOG.md | sed '$d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No release notes found for $VERSION" > release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: release_notes.md
          generate_release_notes: true
          files: |
            artifacts/**/*.apk
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
