name: Dependency Submission

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-submission:
    name: Submit Dependency Graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # submit the dependency graph snapshot via the Dependency submission API
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      # Builds and submits the Gradle dependency graph so dependency-review.yml has a
      # populated graph to diff. The push->main run establishes the base graph; the
      # pull_request run submits the PR-branch graph. Fork/Dependabot PRs run with a
      # read-only token, so their submission is skipped rather than failing the job.
      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          # Submit ONLY real runtime dependencies (allowlist) instead of maintaining
          # an ever-growing denylist of build-tooling configurations. Every
          # ".*RuntimeClasspath" carries the shipped app deps across the JVM, Desktop,
          # Android and test-runtime targets; by construction it excludes every
          # buildscript/plugin classpath, AGP lint + Unified Test Platform, KSP and
          # compiler plugins, and the Kotlin Swift-export worker. Those tooling
          # transitives (netty, httpclient, commons-lang3, bcpkix, opentelemetry,
          # bouncycastle, ...) are exactly the ones Dependabot cannot update, whose
          # security-update jobs failed with security_update_dependency_not_found on
          # every graph resubmission. ":build-logic" (the convention-plugin project)
          # is excluded so its own runtimeClasspath does not re-admit the AGP/Kotlin
          # plugins as if they were app dependencies. Tooling CVEs are still addressed
          # by AGP/Kotlin version-catalog bumps, which Dependabot tracks.
          #
          # Trade-off: Kotlin/Native (iOS) targets expose no *RuntimeClasspath, so
          # iOS-only klib variants (e.g. compose ui-uikit) drop out of the graph.
          # Every such library is still covered via its JVM/Android variant, which
          # carries the same security advisories. Adding a new tooling dependency now
          # needs no workflow edit — the allowlist never admits it.
          dependency-graph-exclude-projects: ':build-logic'
          dependency-graph-include-configurations: '.*[Rr]untimeClasspath'
