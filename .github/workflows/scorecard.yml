name: Scorecard

on:
  # Re-evaluate when branch protection changes, weekly, and on pushes to main.
  branch_protection_rule:
  schedule:
    - cron: '30 4 * * 1'
  push:
    branches: [ main ]
  # Manual re-run knob: the Binary-Artifacts gradle-wrapper exemption requires a
  # *successful* Build run at HEAD, so push-triggered runs (which race the ~35-min
  # Build) can't see it — dispatch after Build finishes to re-evaluate.
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # upload SARIF results to code scanning
      id-token: write          # publish results to the OpenSSF Scorecard API (badge)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
