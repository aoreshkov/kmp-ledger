name: CodeQL

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '27 3 * * 1'   # weekly, Monday 03:27 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: java-kotlin
          # 'none' can't extract this KMP/Gradle project, so trace a real build.
          build-mode: manual

      - name: Build for CodeQL extraction
        # Compile the app and its shared modules without caching/daemon so the
        # CodeQL tracer observes the Kotlin compilation.
        run: ./gradlew :androidApp:assembleDebug --no-daemon --no-build-cache --no-configuration-cache

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: "/language:java-kotlin"
