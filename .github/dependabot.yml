version: 2
updates:
  # Keep GitHub Actions current. Dependabot updates both the pinned commit SHA
  # and the trailing "# vX" version comment, so SHA-pinning stays maintainable.
  # `directories` (not `directory`) is what supports more than one path: a bare
  # `directory: "/"` covers /.github/workflows and a root-level action.yml only,
  # which silently left the repo's own composite action unscanned.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/gradle-setup"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
    # Supply-chain hardening: wait out the window where a freshly published
    # (potentially compromised) release is live before proposing it.
    cooldown:
      default-days: 3
      semver-major-days: 7

  # Keep Gradle dependencies (including the version catalog) current.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gradle"
    # Majors stay as individual PRs; minor/patch bumps arrive as one weekly PR.
    groups:
      gradle-minor-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3
      semver-major-days: 7
    ignore:
      # Material3, Material3 Adaptive and Navigation 3 must stay on the exact
      # coordinates the Compose Multiplatform release declares itself aligned to
      # (the androidx-material3, androidx-adaptive and androidx-navigation3-*
      # pins in gradle/libs.versions.toml). They move by hand, together with
      # compose-multiplatform, after re-reading the alignment table in its
      # release notes. Note: ignore also suppresses security updates for these
      # artifacts.
      - dependency-name: "org.jetbrains.compose.material3:*"
      - dependency-name: "org.jetbrains.compose.material3.adaptive:*"
      - dependency-name: "org.jetbrains.androidx.navigation3:*"
      - dependency-name: "androidx.navigation3:*"
      # AGP is pinned to what the bundled IntelliJ IDEA plugin supports, and
      # Kotlin moves only after a manual sync check in both IDEA and Android
      # Studio (see the pins in gradle/libs.versions.toml, where the matching
      # lint currency checks are suppressed too). Drop these once IDE support
      # stops gating either line. Note: ignore also suppresses security updates
      # for these artifacts.
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "com.android.application:*"
      - dependency-name: "com.android.kotlin.multiplatform.library:*"
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "org.jetbrains.kotlin.*:*"
