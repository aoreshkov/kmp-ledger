version: 2
updates:
  # Keep GitHub Actions current. Dependabot updates both the pinned commit SHA
  # and the trailing "# vX" version comment, so SHA-pinning stays maintainable.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep Gradle dependencies (including the version catalog) current.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gradle"
