version: 2
updates:
  # Keep GitHub Actions current. Dependabot updates both the pinned commit SHA
  # and the trailing "# vX" version comment, so SHA-pinning stays maintainable.
  # `directories` (not `directory`) is what supports more than one path: a bare
  # `directory: "/"` covers /.github/workflows and a root-level action.yml only,
  # which silently left the repo's own composite action unscanned.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/gradle-setup"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
    # Supply-chain hardening: wait out the window where a freshly published
    # (potentially compromised) release is live before proposing it.
    cooldown:
      default-days: 3
      semver-major-days: 7

  # Keep Gradle dependencies (including the version catalog) current.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gradle"
    # Majors stay as individual PRs; minor/patch bumps arrive as one weekly PR.
    groups:
      gradle-minor-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3
      semver-major-days: 7
    ignore:
      # material3 artifacts must stay aligned with the Compose Multiplatform
      # release (androidx-material3 pin in gradle/libs.versions.toml); drop this
      # when deliberately upgrading compose-multiplatform. Note: ignore also
      # suppresses security updates for these artifacts.
      - dependency-name: "org.jetbrains.compose.material3:*"
      # AGP and Kotlin are pinned to what the bundled IntelliJ IDEA plugin
      # supports (see the pins in gradle/libs.versions.toml, where the matching
      # lint currency checks are suppressed too); bumping either breaks project
      # import in the IDE. Drop these once IDEA supports a newer line. Note:
      # ignore also suppresses security updates for these artifacts.
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "com.android.application:*"
      - dependency-name: "com.android.kotlin.multiplatform.library:*"
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "org.jetbrains.kotlin.*:*"
